<html lang="en">
<head>

<meta name="keywords" content="cyberpunk workspace, focus audio mixer, particle physics sandbox, pixel art generator, responsive developer dashboard, Monetag ad layout suite">

<style>
/* --------------------------------------------------------
   1. LUXURY GLOW THEME DESIGN TOKENS & RESET
-------------------------------------------------------- */
:root {
    --bg-void: #05060b;
    --panel-glass: rgba(13, 15, 26, 0.75);
    --panel-solid: #0d0f1a;
    --border-neon: rgba(34, 230, 255, 0.15);
    --border-glow: rgba(34, 230, 255, 0.4);
    --neon-cyan: #22e6ff;
    --neon-pink: #ff2a74;
    --neon-purple: #a855f7;
    --text-pure: #ffffff;
    --text-dim: #94a3b8;
    --text-muted: #475569;
    --radius-fluid: 20px;
    --transition-premium: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
    overflow-x: hidden;
}

body {
    background-color: var(--bg-void);
    color: var(--text-pure);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
}

/* --------------------------------------------------------
   2. STICKY DYNAMIC LOGO HEADER NAVIGATION BAR
-------------------------------------------------------- */
header.nexus-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5, 6, 11, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-neon);
    transition: var(--transition-premium);
}

.nav-layout {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 76px;
}

.brand-identity {
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: -0.03em;
    color: var(--text-pure);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 0;
}

.brand-identity span {
    color: var(--neon-cyan);
    text-shadow: 0 0 12px rgba(34, 230, 255, 0.5);
}

.nav-menu-tabs {
    display: flex;
    align-items: center;
    gap: 32px;
    list-style: none;
}

.nav-menu-tabs a {
    color: var(--text-dim);
    font-weight: 600;
    font-size: 0.95rem;
    position: relative;
    padding: 8px 0;
    transition: var(--transition-premium);
}

.nav-menu-tabs a:hover {
    color: var(--neon-cyan);
    text-shadow: 0 0 8px rgba(34, 230, 255, 0.4);
}

/* Hidden elements management logic rules */
.nav-menu-tabs.hidden-state {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-4px);
}

.btn-glowing {
    background: linear-gradient(135deg, var(--neon-cyan), #0fb5d6);
    color: #030a0d;
    border: 0;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.95rem;
    border-radius: 12px;
    padding: 12px 24px;
    transition: var(--transition-premium);
    box-shadow: 0 0 20px rgba(34, 230, 255, 0.3);
}

.btn-glowing:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 0 30px rgba(34, 230, 255, 0.6);
}

/* --------------------------------------------------------
   3. LUXURY PUBLIC SaaS LANDING PAGE ARCHITECTURE
-------------------------------------------------------- */
#homepage-view {
    display: block;
    animation: fadeInView 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Deep Parallax Hero Gradients Container */
.hero-matrix {
    padding: 120px 0 80px;
    text-align: center;
    position: relative;
    background: radial-gradient(circle at 50% 0%, rgba(34, 230, 255, 0.08), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 42, 116, 0.04), transparent 50%);
}

.hero-matrix h1 {
    font-size: clamp(2.6rem, 6.5vw, 4.8rem);
    line-height: 1.05;
    letter-spacing: -0.04em;
    font-weight: 800;
    margin-bottom: 24px;
    background: linear-gradient(to bottom, #ffffff 60%, #64748b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero-matrix p {
    font-size: clamp(1.1rem, 2vw, 1.35rem);
    color: var(--text-dim);
    max-width: 760px;
    margin: 0 auto 40px;
}

/* CSS-Drawn Pseudo-3D Parallax Landscape Perspective */
.perspective-container {
    width: 100%;
    max-width: 800px;
    height: 180px;
    margin: 40px auto 0;
    perspective: 120px;
    overflow: hidden;
    position: relative;
    border-bottom: 1px solid var(--border-neon);
}

.grid-3d-landscape {
    width: 100%;
    height: 300px;
    background-size: 40px 40px;
    background-image: linear-gradient(to right, rgba(34, 230, 255, 0.15) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(34, 230, 255, 0.15) 1px, transparent 1px);
    transform: rotateX(65deg);
    transform-origin: top center;
    animation: gridScroll 12s linear infinite;
}

@keyframes gridScroll {
    0% { background-position: 0 0; }
    100% { background-position: 0 300px; }
}

/* Interactive Interactive Scroll Parallax Reveal Cards */
.reveal-block {
    padding: 80px 0;
}

.reveal-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
}

.reveal-card {
    background: var(--panel-glass);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-neon);
    border-radius: var(--radius-fluid);
    padding: 36px 28px;
    transition: var(--transition-premium);
    position: relative;
    overflow: hidden;
}

.reveal-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 70%, rgba(34, 230, 255, 0.05));
    opacity: 0;
    transition: var(--transition-premium);
}

.reveal-card:hover {
    transform: translateY(-8px) scale(1.01);
    border-color: var(--border-glow);
    box-shadow: 0 20px 40px rgba(34, 230, 255, 0.08), inset 0 0 20px rgba(34, 230, 255, 0.05);
}

.reveal-card:hover::before {
    opacity: 1;
}

.card-accent-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-bottom: 24px;
    box-shadow: 0 0 10px currentColor;
}

.reveal-card h3 {
    font-size: 1.3rem;
    margin-bottom: 12px;
    letter-spacing: -0.02em;
}

.reveal-card p {
    color: var(--text-dim);
    font-size: 0.98rem;
    line-height: 1.5;
}

/* Monetag Architecture Ad Placeholders */
.monetag-slot-wrapper {
    background: linear-gradient(135deg, var(--panel-solid), rgba(13,15,26,0.3));
    border: 1px dashed var(--text-muted);
    border-radius: var(--radius-fluid);
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    transition: var(--transition-premium);
}

.monetag-slot-wrapper:hover {
    border-color: var(--neon-cyan);
}

.ad-meta-labels small {
    color: var(--text-muted);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: block;
    margin-bottom: 4px;
}

.ad-content-box {
    width: 100%;
    max-width: 468px;
    height: 60px;
    background: rgba(5,6,11,0.5);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.02);
}

/* --------------------------------------------------------
   4. PRIVATE MASTER DASHBOARD ENVIRONMENT SUITE
-------------------------------------------------------- */
#dashboard-view {
    display: none;
    padding: 40px 0 80px;
    animation: fadeInView 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes fadeInView {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
}

.dashboard-workspace-tabs {
    display: none; /* Managed by toggle script engines */
    margin-bottom: 32px;
    border-bottom: 1px solid var(--line);
}

.panel-container-card {
    background: var(--panel-solid);
    border: 1px solid var(--border-neon);
    border-radius: var(--radius-fluid);
    padding: 32px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

/* PROJECT 1: AMBIENT SOUNDSCAPE STUDIO */
.visualizer-stage-box {
    background: rgba(5, 6, 11, 0.6);
    border: 1px solid rgba(255,255,255,0.03);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

.visualizer-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.02em;
}

.eq-matrix-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 64px;
    width: 100%;
    max-width: 480px;
}

.eq-bar-node {
    flex: 1;
    height: 4px;
    background: linear-gradient(to top, var(--neon-cyan), var(--neon-purple));
    border-radius: 4px;
    transition: height 0.15s ease;
    box-shadow: 0 0 8px rgba(34, 230, 255, 0.3);
}

/* Audio Channel Mixer Cards Grid */
.mixer-channels-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 32px;
}

.mixer-card-unit {
    background: rgba(23, 26, 38, 0.4);
    border: 1px solid var(--border-neon);
    border-radius: 16px;
    padding: 24px;
    transition: var(--transition-premium);
}

.mixer-card-unit:hover {
    border-color: rgba(34,230,255,0.3);
    transform: translateY(-2px);
}

.channel-meta-info {
    display: flex;
